name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Run tests
      run: ./gradlew test
    
    - name: Build JAR
      run: ./gradlew jar
    
    - name: Test CLI
      run: |
        chmod +x bin/tfpp
        ./bin/tfpp --help
        echo "name: Test" > test.txt
        echo 'Hello [[${name}]]!' > template.txt
        ./bin/tfpp process template.txt --var name="CI Test" > output.txt
        grep "Hello CI Test!" output.txt

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Build JAR
      run: ./gradlew jar
    
    - name: Test directory processing
      run: |
        chmod +x bin/tfpp
        mkdir -p test-templates
        echo '<h1 th:text="${title}">Default Title</h1>' > test-templates/index.html
        echo 'Text: [(${content})]' > test-templates/readme.txt
        echo '{"title": "TFPP Test", "content": "Integration testing"}' > data.json
        ./bin/tfpp process-dir test-templates output --data data.json --verbose
        grep "TFPP Test" output/index.html
        grep "Integration testing" output/readme.txt
    
    - name: Test installation script
      run: |
        chmod +x install.sh
        mkdir -p test-bin
        ./install.sh test-bin
        test-bin/tfpp --help

  version-and-release:
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Calculate version
      id: calculate-version
      uses: bitshifted/git-auto-semver@v2
    
    - name: Check if new version
      id: check-version
      run: |
        if git rev-parse "v${{ steps.calculate-version.outputs.version-string }}" >/dev/null 2>&1; then
          echo "version-exists=true" >> $GITHUB_OUTPUT
          echo "Tag v${{ steps.calculate-version.outputs.version-string }} already exists"
        else
          echo "version-exists=false" >> $GITHUB_OUTPUT
          echo "New version: v${{ steps.calculate-version.outputs.version-string }}"
        fi
    
    - name: Create and push tag
      if: steps.check-version.outputs.version-exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "v${{ steps.calculate-version.outputs.version-string }}"
        git push origin "v${{ steps.calculate-version.outputs.version-string }}"