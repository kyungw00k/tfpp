name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Build JAR
      run: ./gradlew jar
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: TFPP ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## TFPP (Thymeleaf File Preprocessor) ${{ steps.get_version.outputs.VERSION }}
          
          ### Installation
          
          **Quick install:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/kyungw00k/tfpp/main/install.sh | sudo bash
          ```
          
          **Custom directory:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/kyungw00k/tfpp/main/install.sh | bash -s ~/bin
          ```
          
          ### Manual Installation
          
          1. Download `tfpp.jar` from the assets below
          2. Run with: `java -jar tfpp.jar --help`
          
          ### What's New
          
          - Thymeleaf-powered template processing
          - Support for HTML, TEXT, CSS, JavaScript templates
          - JSON/YAML data binding
          - Directory processing with watch mode
          - Configuration file support
          
          For more information, see the [README](https://github.com/kyungw00k/tfpp/blob/main/README.md).
        files: |
          ./app/build/libs/tfpp.jar
        draft: false
        prerelease: false