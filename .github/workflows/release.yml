name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Build JAR
      run: ./gradlew jar
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: TFPP ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## TFPP (Thymeleaf File Preprocessor) ${{ steps.get_version.outputs.VERSION }}
          
          ### Installation
          
          **Quick install:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/kyungw00k/tfpp/main/install-remote.sh | sudo bash
          ```
          
          **Custom directory:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/kyungw00k/tfpp/main/install-remote.sh | bash -s ~/bin
          ```
          
          ### Manual Installation
          
          1. Download `tfpp.jar` from the assets below
          2. Run with: `java -jar tfpp.jar --help`
          
          ### What's New
          
          - Thymeleaf-powered template processing
          - Support for HTML, TEXT, CSS, JavaScript templates
          - JSON/YAML data binding
          - Directory processing with watch mode
          - Configuration file support
          
          For more information, see the [README](https://github.com/kyungw00k/tfpp/blob/main/README.md).
        draft: false
        prerelease: false
    
    - name: Upload JAR Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./app/build/libs/tfpp.jar
        asset_name: tfpp.jar
        asset_content_type: application/java-archive