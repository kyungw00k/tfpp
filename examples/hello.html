<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hello TFPP</title>
</head>
<body>
    <h1>Hello, <span th:text="${name}">World</span>!</h1>
    <p>Welcome to TFPP (Thymeleaf File Preprocessor)</p>
    <p>Your age is: <span th:text="${age}">unknown</span></p>
    <p>Debug mode: <span th:text="${debug}">false</span></p>
</body>
</html>
